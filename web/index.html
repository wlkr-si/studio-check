<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Audit a GitHub organisation's public repositories and compare saved audit reports locally.">
  <link rel="canonical" href="https://studio-check.wlkr.si/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WLKR.SI">
  <meta property="og:title" content="studio-check — WLKR.SI">
  <meta property="og:description" content="Audit a GitHub organisation's public repositories and compare saved audit reports locally.">
  <meta property="og:url" content="https://studio-check.wlkr.si/">
  <meta property="og:image" content="https://wlkr.si/social/studio-check.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="studio-check — Audit the public entry points of a GitHub organisation, without credentials.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="studio-check — WLKR.SI">
  <meta name="twitter:description" content="Audit a GitHub organisation's public repositories and compare saved audit reports locally.">
  <meta name="twitter:image" content="https://wlkr.si/social/studio-check.png">
  <meta name="twitter:image:alt" content="studio-check — Audit the public entry points of a GitHub organisation, without credentials.">
  <title>studio-check — WLKR.SI</title>
  <link rel="icon" href="https://wlkr.si/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <header><h1>studio-check</h1></header>
    <form id="audit-form">
      <label for="organization">GitHub organization</label>
      <div class="form-row">
        <input id="organization" name="org" value="wlkr-si" required maxlength="39" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="audit-button" type="submit">Audit</button>
      </div>
      <label class="archive-option"><input id="include-archived" name="archived" type="checkbox">Include archived</label>
    </form>
    <div class="open-report"><label for="saved-report">Open saved report</label><input id="saved-report" type="file" accept=".json,application/json"></div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section id="results" aria-label="Report results" hidden></section>
    <noscript><p>JavaScript is required to run this public GitHub audit.</p></noscript>
  </main>
  <footer>
    <nav aria-label="Project"><a href="https://github.com/wlkr-si/studio-check">Source</a><a href="https://github.com/wlkr-si/studio-check#run">CLI</a><a href="https://wlkr.si">Studio</a></nav>
    <a href="https://wlkr.si" class="studio-badge"><picture><source media="(prefers-color-scheme: dark)" srcset="https://wlkr.si/brand/part-of-wlkr-si-dark.svg"><img src="https://wlkr.si/brand/part-of-wlkr-si-light.svg" alt="Part of WLKR.SI" width="184" height="32"></picture></a>
  </footer>
</body>
</html>
